services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: SistemaBiblioteca
    volumes:
      - biblioteca_db:/var/lib/mysql
      - biblioteca_socket:/var/run/mysqld
      - ./sql/SistemaBiblioteca_v6.5.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html
      - biblioteca_socket:/var/run/mysqld

volumes:
  biblioteca_db:
  biblioteca_socket: